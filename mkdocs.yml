site_name: Golden Path de Arquitetura
# Avisos do mkdocs (links/nav quebrados) viram erro e falham o CI
strict: true
site_description: Caminho recomendado para construir e operar serviços
repo_url: https://github.com/edtroleis/techdocs-wiki-golden-path
edit_uri: edit/main/docs/
nav:
  - Início: index.md
  - Princípios: principios.md
  - Construir:
      - Estrutura do serviço: estrutura-servico.md
      - CI/CD: ci-cd.md
  - Operar:
      - Observabilidade: observabilidade.md
      - Segurança: seguranca.md
  - Checklist de produção: checklist.md
plugins:
  - techdocs-core
